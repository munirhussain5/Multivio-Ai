<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Container (Google Search Favicon standard) -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="28" y="28" width="456" height="456" rx="112" fill="none" stroke="#60A5FA" stroke-width="4" stroke-opacity="0.4" />

  <!-- Central Brain / Neural Network Icon -->
  <g transform="translate(96, 96)" filter="url(#glow)">
    <!-- Left Hemisphere -->
    <path d="M 160 50 C 130 50 100 68 85 96 C 70 88 50 94 40 110 C 26 130 28 158 42 176 C 26 194 24 222 38 242 C 48 256 66 264 82 260 C 95 284 125 300 155 300 L 160 300" 
          fill="none" stroke="url(#brainGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Right Hemisphere -->
    <path d="M 160 50 C 190 50 220 68 235 96 C 250 88 270 94 280 110 C 294 130 292 158 278 176 C 294 194 296 222 282 242 C 272 256 254 264 238 260 C 225 284 195 300 165 300 L 160 300" 
          fill="none" stroke="url(#brainGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Central Neural Dividing Axis & Synthesis Synapses -->
    <line x1="160" y1="50" x2="160" y2="300" stroke="#93C5FD" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 18" />

    <!-- Left hemisphere neural circuits -->
    <path d="M 85 96 C 110 120 120 150 160 150" fill="none" stroke="url(#glowGrad)" stroke-width="14" stroke-linecap="round" />
    <path d="M 42 176 C 80 180 110 200 160 210" fill="none" stroke="url(#glowGrad)" stroke-width="14" stroke-linecap="round" />
    <path d="M 82 260 C 110 245 135 240 160 240" fill="none" stroke="url(#glowGrad)" stroke-width="14" stroke-linecap="round" />

    <!-- Right hemisphere neural circuits -->
    <path d="M 235 96 C 210 120 200 150 160 150" fill="none" stroke="url(#glowGrad)" stroke-width="14" stroke-linecap="round" />
    <path d="M 278 176 C 240 180 210 200 160 210" fill="none" stroke="url(#glowGrad)" stroke-width="14" stroke-linecap="round" />
    <path d="M 238 260 C 210 245 185 240 160 240" fill="none" stroke="url(#glowGrad)" stroke-width="14" stroke-linecap="round" />

    <!-- 4 AI Synapse Nodes (ChatGPT, Gemini, Claude, DeepSeek) -->
    <circle cx="85" cy="96" r="14" fill="#34D399" stroke="#FFFFFF" stroke-width="4" />
    <circle cx="235" cy="96" r="14" fill="#60A5FA" stroke="#FFFFFF" stroke-width="4" />
    <circle cx="42" cy="176" r="14" fill="#FBBF24" stroke="#FFFFFF" stroke-width="4" />
    <circle cx="278" cy="176" r="14" fill="#A78BFA" stroke="#FFFFFF" stroke-width="4" />

    <!-- Central Golden Synthesis Core -->
    <circle cx="160" cy="175" r="18" fill="#FFFFFF" stroke="#3B82F6" stroke-width="5" />
    <circle cx="160" cy="175" r="8" fill="#2563EB" />
  </g>
</svg>
